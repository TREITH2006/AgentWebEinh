[pytest]
testpaths = tests
# ``auto`` lets the async unit tests (frame fan-out, state machine) be written as
# plain ``async def test_*`` without repeating the marker on every function.
asyncio_mode = auto
addopts = -ra --strict-markers
filterwarnings =
    error
    # Starlette's TestClient warns unless httpx2 is installed. httpx2 is not a
    # project dependency and the suite only drives the in-process ASGI transport.
    ignore:Using .httpx. with .starlette.testclient. is deprecated
    ignore::pytest.PytestDeprecationWarning